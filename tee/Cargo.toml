[workspace]
resolver = "2"
members = ["attestd"]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
# 1.88 is the floor of the locked dependency tree: the dstack-sdk ->
# alloy chain (pulled in by the attestd crate) requires rustc 1.88+
# transitively. The image builds with a newer toolchain still — see
# image/Dockerfile.
rust-version = "1.88"
license = "Apache-2.0"
publish = false
repository = "https://github.com/taostat/blockmachine-miner"

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# WebSocket probe of the provider's WSS data plane. rustls (webpki roots)
# matches reqwest's TLS stack so the image carries one TLS implementation.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false }
# Percent-encode the operator API key before it goes into any upstream URL.
percent-encoding = "2.3"
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
dstack-sdk = "0.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
