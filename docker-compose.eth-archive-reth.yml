services:
  gateway:
    image: nginx:1.31.0-alpine
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./gateway/miner-gateway.eth.conf.template:/etc/nginx/conf.d/miner-gateway.conf.template:ro
      - ./gateway/entrypoint.sh:/docker-entrypoint.d/90-blockmachine.sh:ro
      - certbot_webroot:/var/www/certbot:ro
    environment:
      SECRET_V1: ${SECRET_V1}
      SECRET_V2: ${SECRET_V2:-}
      BACKEND_HOST: node
      BACKEND_HTTP_PORT: ${BACKEND_HTTP_PORT:-8545}
      BACKEND_WS_PORT: ${BACKEND_WS_PORT:-8546}
      METRICS_HOST: metrics
      METRICS_PORT: ${METRICS_PORT:-9100}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/etc/nginx/ssl/key.pem}
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - node
      - metrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Generates the Engine API JWT once on first run. Reuses the reth image so
  # there is no separate alpine pull and no apk install on cold start.
  jwt-init:
    image: ghcr.io/paradigmxyz/reth:v2.2.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -s /jwt/jwt.hex ]; then
          # od is present in the reth runtime image; xxd is not. -An strips the
          # offset column, -v keeps duplicate lines, -tx1 emits one hex byte per
          # field. tr collapses whitespace so the file is a single 64-char hex
          # string, matching the Engine API JWT format.
          tmp=/jwt/jwt.hex.tmp
          head -c 32 /dev/urandom | od -An -v -tx1 | tr -d ' \n' > "$$tmp"
          [ "$$(wc -c < "$$tmp")" = "64" ] || { echo "ERROR: JWT generation produced wrong length" >&2; rm -f "$$tmp"; exit 1; }
          mv "$$tmp" /jwt/jwt.hex
          chmod 0644 /jwt/jwt.hex
          echo "Generated Engine API JWT secret"
        else
          echo "Engine API JWT secret already exists"
        fi
    volumes:
      - eth_jwt:/jwt
    restart: "no"

  node:
    image: ghcr.io/paradigmxyz/reth:v2.2.0
    depends_on:
      jwt-init:
        condition: service_completed_successfully
    command:
      - node
      - --chain=mainnet
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,trace,debug
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=eth,net,web3,trace,debug
      - --ws.origins=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/jwt/jwt.hex
      - --metrics=0.0.0.0:9101
      - --port=30303
      - --discovery.port=30303
    ports:
      - "30303:30303/tcp"
      - "30303:30303/udp"
    volumes:
      - eth_data_archive_reth:/data
      - eth_jwt:/jwt:ro
    restart: unless-stopped

  consensus:
    image: sigp/lighthouse:v8.1.3-modern
    depends_on:
      jwt-init:
        condition: service_completed_successfully
    command:
      - lighthouse
      - bn
      - --network=mainnet
      - --datadir=/data
      - --http
      - --http-address=0.0.0.0
      - --http-port=5052
      - --execution-endpoint=http://node:8551
      - --execution-jwt=/jwt/jwt.hex
      - --checkpoint-sync-url=${CHECKPOINT_SYNC_URL:-https://mainnet.checkpoint.sigp.io}
      - --disable-deposit-contract-sync
      - --port=9000
      - --discovery-port=9000
      - --quic-port=9001
    ports:
      - "9000:9000/tcp"
      - "9000:9000/udp"
      - "9001:9001/udp"
    volumes:
      - lighthouse_data:/data
      - eth_jwt:/jwt:ro
    restart: unless-stopped

  metrics:
    image: python:3.12-alpine
    command: ["python", "/app/exporter.py"]
    volumes:
      - ./metrics:/app:ro
      - ./.git:/repo/.git:ro
      - ./ssl:/etc/nginx/ssl:ro
      - eth_data_archive_reth:/node-data:ro
      - /proc:/host/proc:ro
    environment:
      CHAIN: eth
      EL_CLIENT: reth
      ETH_TIER: archive-reth
      METRICS_PORT: ${METRICS_PORT:-9100}
      METRICS_SECRET_V1: ${SECRET_V1}
      METRICS_SECRET_V2: ${SECRET_V2:-}
      NODE_RPC_URL: http://node:8545
      NODE_NATIVE_METRICS_URL: http://node:9101/
      CL_RPC_URL: http://consensus:5052
      GATEWAY_HEALTH_URL: http://gateway/health
      NODE_DATA_PATH: /node-data
      HOST_PROC_PATH: /host/proc
      GIT_DIR: /repo/.git
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}
      BM_MINER_GIT_SHA: ${BM_MINER_GIT_SHA:-unknown}
      BM_MINER_GIT_BRANCH: ${BM_MINER_GIT_BRANCH:-unknown}
    depends_on:
      - node
    restart: unless-stopped

volumes:
  eth_data_archive_reth:
  eth_jwt:
  lighthouse_data:
  certbot_webroot:
