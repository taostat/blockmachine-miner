services:
  gateway:
    image: nginx:1.31.0-alpine
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./gateway/miner-gateway.${GATEWAY_TEMPLATE:-tao}.conf.template:/etc/nginx/conf.d/miner-gateway.conf.template:ro
      - ./gateway/entrypoint.sh:/docker-entrypoint.d/90-blockmachine.sh:ro
      - certbot_webroot:/var/www/certbot:ro
    environment:
      SECRET_V1: ${SECRET_V1}
      SECRET_V2: ${SECRET_V2:-}
      BACKEND_HOST: ${BACKEND_HOST:-host.docker.internal}
      BACKEND_PORT: ${BACKEND_PORT:-9944}
      BACKEND_HTTP_PORT: ${BACKEND_HTTP_PORT:-8545}
      BACKEND_WS_PORT: ${BACKEND_WS_PORT:-8546}
      METRICS_HOST: metrics
      METRICS_PORT: ${METRICS_PORT:-9100}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/etc/nginx/ssl/key.pem}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - metrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  metrics:
    image: python:3.12-alpine
    command: ["python", "/app/exporter.py"]
    volumes:
      - ./metrics:/app:ro
      - ./.git:/repo/.git:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /proc:/host/proc:ro
    environment:
      CHAIN: ${CHAIN:-tao}
      METRICS_PORT: ${METRICS_PORT:-9100}
      METRICS_SECRET_V1: ${SECRET_V1}
      METRICS_SECRET_V2: ${SECRET_V2:-}
      NODE_RPC_URL: http://${BACKEND_HOST:-host.docker.internal}:${BACKEND_PORT:-9944}
      NODE_NATIVE_METRICS_URL: ${NODE_NATIVE_METRICS_URL:-}
      GATEWAY_HEALTH_URL: http://gateway/health
      HOST_PROC_PATH: /host/proc
      GIT_DIR: /repo/.git
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}
      BM_MINER_GIT_SHA: ${BM_MINER_GIT_SHA:-unknown}
      BM_MINER_GIT_BRANCH: ${BM_MINER_GIT_BRANCH:-unknown}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  certbot_webroot:
